aid: geek
name: Geek+
description: 'Geek+ (Geekplus, HKEX: 2590) is a global leader in AI-driven autonomous mobile robot
  (AMR) solutions for warehouse and logistics automation. Founded in 2015, it delivers end-to-end
  smart-warehouse systems spanning shelf-to-person (PopPick), tote-to-person (RoboShuttle), pallet-to-person
  (Skycube) storage and retrieval, robot-arm picking, sorting, and intralogistics transport. Its All-in-One
  Software Suite (Robot Management System, Warehouse Execution System, Intelligent Warehouse Management
  System, data and simulation platforms) exposes open REST APIs and SDKs so customers and partners can
  integrate robot fleets with major WMS, ERP, and MES platforms including SAP, Oracle, Microsoft Dynamics,
  Manhattan Associates, and Blue Yonder. Geek+ serves 3PL, retail, e-commerce, apparel, grocery, healthcare
  and pharma, manufacturing, automotive, electronics, and cold-chain logistics across 40+ countries, with
  950+ deployed warehouses. In 2025 it became the world''s first publicly listed AMR warehouse robotics
  company on the Hong Kong Stock Exchange.'
